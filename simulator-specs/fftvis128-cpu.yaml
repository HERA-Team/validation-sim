simulator: FFTVis
precision: 2
check_antenna_conjugation: false
interpolation_function: "az_za_map_coordinates"
flat_array_tol: 8.0
nprocesses: 128
coord_method: CoordinateRotationERFA
coord_method_params:
  update_bcrs_every: 100000000
nchunks: 16  # should probably find a better way to specify this. Its optimal value depends on Nsrc and the number of processes
